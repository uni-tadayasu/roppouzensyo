name: 六法書架を公開・更新

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: ソースを取得
        uses: actions/checkout@v5
      - name: GitHub Pagesの設定を取得
        id: pages
        uses: actions/configure-pages@v5
      - name: e-Govから六法を更新
        run: python3 scripts/update-laws.py
      - name: 公開用ファイルを作成
        env:
          ROPPO_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/build-site.py --output _site --site-url "$ROPPO_SITE_URL"
      - name: 公開ファイルを登録
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesに公開
        id: deployment
        uses: actions/deploy-pages@v4
